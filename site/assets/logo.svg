<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- immich-crosslink: the lens and link on a tile (design/logo-ideas, A6). Immich's colours, never its shapes. Immich
     Mount's lens (its five colours clockwise from the top) linked with a ring in its light glass blue: each passes over
     the other once, with a see-through gap where it passes under. -->
  <defs>
    <clipPath id="top"><circle cx="128" cy="86.25" r="32.0"/></clipPath>
    <clipPath id="bottom"><circle cx="128" cy="169.75" r="32.0"/></clipPath>
    <mask id="under-top" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><rect width="256" height="256" fill="#fff"/>
      <g clip-path="url(#top)"><circle cx="159.0" cy="128" r="52" fill="none" stroke="#000" stroke-width="30"/></g></mask>
    <mask id="under-bottom" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><rect width="256" height="256" fill="#fff"/>
      <g clip-path="url(#bottom)"><circle cx="97.0" cy="128" r="52" fill="none" stroke="#000" stroke-width="30"/></g></mask>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="#241f31"/>
  <g mask="url(#under-top)"><path d="M 99.27 76.05 A 52 52 0 0 1 145.71 109.79" stroke="#FA2921" stroke-width="20" fill="none"/><path d="M 147.11 114.10 A 52 52 0 0 1 129.37 168.70" stroke="#ED79B5" stroke-width="20" fill="none"/><path d="M 125.70 171.36 A 52 52 0 0 1 68.30 171.36" stroke="#FFB400" stroke-width="20" fill="none"/><path d="M 64.63 168.70 A 52 52 0 0 1 46.89 114.10" stroke="#1E83F7" stroke-width="20" fill="none"/><path d="M 48.29 109.79 A 52 52 0 0 1 94.73 76.05" stroke="#18C249" stroke-width="20" fill="none"/></g>
  <g mask="url(#under-bottom)"><circle cx="159.0" cy="128" r="52" stroke="#62a0ea" stroke-width="20" fill="none"/></g>
</svg>
